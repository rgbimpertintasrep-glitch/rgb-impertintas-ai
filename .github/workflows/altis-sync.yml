name: Altis Catalog Sync
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: altis-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect private Tailscale network
        uses: tailscale/github-action@v3
        with:
          authkey: \${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: rgb-altis-sync
      - name: Check required secrets
        shell: bash
        env:
          ALTIS_EXPORT_URL: \${{ secrets.ALTIS_EXPORT_URL }}
          RENDER_APP_URL: \${{ secrets.RENDER_APP_URL }}
          SYNC_ADMIN_TOKEN: \${{ secrets.SYNC_ADMIN_TOKEN }}
        run: |
          test -n "$ALTIS_EXPORT_URL" || { echo "Missing ALTIS_EXPORT_URL secret"; exit 1; }
          test -n "$RENDER_APP_URL" || { echo "Missing RENDER_APP_URL secret"; exit 1; }
          test -n "$SYNC_ADMIN_TOKEN" || { echo "Missing SYNC_ADMIN_TOKEN secret"; exit 1; }
          tailscale status
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck, tests and build
        run: npm run typecheck && npm test && npm run build
      - name: Sync protected Altis snapshot to Render
        env:
          ALTIS_EXPORT_URL: \${{ secrets.ALTIS_EXPORT_URL }}
          ALTIS_EXPORT_TOKEN: \${{ secrets.ALTIS_EXPORT_TOKEN }}
          ALTIS_STOCK_FIELD: \${{ vars.ALTIS_STOCK_FIELD }}
          ALTIS_EXPORT_IS_FULL_SNAPSHOT: \${{ vars.ALTIS_EXPORT_IS_FULL_SNAPSHOT }}
          RENDER_APP_URL: \${{ secrets.RENDER_APP_URL }}
          SYNC_ADMIN_TOKEN: \${{ secrets.SYNC_ADMIN_TOKEN }}
        run: npm run sync:push
