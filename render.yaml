services:
  - type: web
    name: rgb-impertintas-ai
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SYNC_ADMIN_TOKEN
        sync: false
      - key: ALTIS_EXPORT_URL
        sync: false
      - key: ALTIS_EXPORT_TOKEN
        sync: false
      - key: ALTIS_STOCK_FIELD
        sync: false
      - key: ALTIS_EXPORT_IS_FULL_SNAPSHOT
        value: "false"
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE
        sync: false
      - key: EVOLUTION_WEBHOOK_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-120b
